# Local production-like stack: the API plus a real Qdrant instance.
#
# Start with:  docker compose up --build
# Then follow the curl examples in README.md.

services:
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    environment:
      # Production mode enables the security guard rails, so an API key is
      # required. Replace this value before exposing the service.
      VIDEO_RAG_ENVIRONMENT: production
      VIDEO_RAG_API_KEYS: change-me
      VIDEO_RAG_LOG_JSON: "true"
      VIDEO_RAG_DATA_DIR: /app/data
      VIDEO_RAG_FRONTEND_DIR: /app/frontend
      # Vectors live in Qdrant; the SQLite registry stays on the volume.
      VIDEO_RAG_VECTOR_BACKEND: qdrant
      VIDEO_RAG_QDRANT_URL: http://qdrant:6333
      VIDEO_RAG_QDRANT_COLLECTION: chunks
      # Embeddings are always Jina, and the LLM is required (the backend
      # refuses to start without a key). Set both before first start.
      VIDEO_RAG_JINA_API_KEY: your-jina-key-here
      VIDEO_RAG_EMBEDDING_DIMENSION: 1024
      VIDEO_RAG_LLM_API_KEY: your-llm-key-here
      VIDEO_RAG_LLM_BASE_URL: https://api.groq.com/openai/v1
      VIDEO_RAG_LLM_MODEL: qwen/qwen3.8-27b
    volumes:
      - api_data:/app/data
    depends_on:
      qdrant:
        condition: service_started
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:v1.12.4
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

volumes:
  api_data:
  qdrant_data:
